name: Android collection verification
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'
      - name: Compile both collection variants and verify event aggregation
        working-directory: android
        run: gradle --no-daemon testUsageDebugUnitTest testCallTrialDebugUnitTest assembleUsageDebug assembleCallTrialDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aneum-android-test-apks
          path: android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 7
